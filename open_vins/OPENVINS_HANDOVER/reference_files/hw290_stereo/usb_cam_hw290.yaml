/**:
  ros__parameters:
    video_device: "/dev/video0"
    framerate: 30.0
    io_method: "mmap"
    frame_id: "camera_link"
    pixel_format: "mjpeg2rgb"
    image_width: 1280
    image_height: 480
    camera_name: "hw290_side_by_side"
    camera_info_url: ""
    autofocus: false
    # This camera reports automatic mode but can remain at an unusably dark
    # exposure. Five milliseconds limits motion blur; high sensor gain keeps
    # enough texture for KLT tracking in the tested desk lighting.
    autoexposure: false
    exposure: 50
    brightness: 0
    gain: 255
    auto_white_balance: true
