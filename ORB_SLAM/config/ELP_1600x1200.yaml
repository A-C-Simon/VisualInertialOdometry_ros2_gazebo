%YAML:1.0

#--------------------------------------------------------------------------------------------
# ELP 3DGS1200P01 stereo - ORB_SLAM3 config generated from /home/ac/Documents/Camera_calib/calib
# per-eye: 1600x1200, side-by-side MJPG 3200x1200 on /dev/video0
# stereo rms 0.2908px, baseline 59.9mm, f_rect 1082.8
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Left eye (K1/D1)
Camera1.fx: 1059.9312870615151
Camera1.fy: 1060.1519662793351
Camera1.cx: 796.8404792677904
Camera1.cy: 617.3901476191367

Camera1.k1: -0.41697202719717813
Camera1.k2: 0.23868669806560916
Camera1.p1: 0.00017631823950302824
Camera1.p2: -0.00016494623165463088
Camera1.k3: -0.09354338804561957

# Right eye (K2/D2)
Camera2.fx: 1066.6272925402388
Camera2.fy: 1066.8214837662406
Camera2.cx: 805.6460783160452
Camera2.cy: 610.4822962784842

Camera2.k1: -0.41813656321762571
Camera2.k2: 0.23173071193891806
Camera2.p1: 8.8234795407672692e-05
Camera2.p2: -0.00010559830169429701
Camera2.k3: -0.081941462220784439

Camera.width: 1600
Camera.height: 1200

Camera.fps: 30

# OpenCV VideoCapture gives BGR
Camera.RGB: 0

# Extrinsics T_c1_c2 (R|T from OpenCV stereoCalibrate, cam1 -> cam2)
Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [0.99996039345261034, -0.00030866650891843553, 0.0088947316478389937, -0.059891332368234879,
         0.00029922976069619319, 0.99999939104508595, 0.0010622480913460818, -0.000037762858127495286,
         -0.0088950541117584075, -0.0010595444509442727, 0.99995987688402044, 0.00072123702864288907,
         0, 0, 0, 1.0]

# Close/Far threshold: baseline-times (40 * 0.0599 ~= 2.4m close range)
Stereo.ThDepth: 40.0

#--------------------------------------------------------------------------------------------
# ORB Parameters (high-res stereo: 2000 features works well at 1600x1200)
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0
